name: Release

# Automatic: after CI passes for a push to main, semantic-release reads the
# Conventional Commits since the last `v*` tag and, when one warrants it,
# creates the next vX.Y.Z tag and GitHub Release (release.config.mjs). The
# same job then points the major tag (`v1`) at it. Releases made with
# GITHUB_TOKEN do not trigger `release` events, so the major tag cannot be left
# to the manual job below.
#
# Manual: publishing a release by hand still moves the major tag.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions: {}

# Serialised so two merges in quick succession cannot race for a version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Tag and publish a release
    # Only trusted, same-repository push runs of CI that passed.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push tags and create the release
      issues: write # comment on released issues, open an issue if releasing fails
      pull-requests: write # comment on released pull requests
    steps:
      # The commit CI tested. If main has moved on since, semantic-release sees
      # the local branch is behind the remote and skips; the newer commit's run
      # releases instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # semantic-release 25 needs Node 22.14 or later.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release
      - name: Move the major tag
        run: |
          TAG=$(git tag --points-at HEAD --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No release for this commit; the major tag stays where it is."
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" HEAD
          git push -f origin "refs/tags/$MAJOR"
          echo "::notice::Released $TAG and moved $MAJOR to it."

  move-major-tag:
    name: Move the major tag (manual release)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
